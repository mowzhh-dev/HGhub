[package]
name = "hghub-web"
version = "0.1.0"
description = "HGhub 网页版服务：复用 src-tauri 的 Rust 核心（接口 / 解密 / 媒体代理），以 HTTP 提供给浏览器"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
publish = false

[[bin]]
name = "hghub-web"
path = "src/main.rs"

[dependencies]
# ---- 与 src-tauri 核心模块一致的依赖（这些模块通过 #[path] 原样编译进来）----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "system-proxy",
  "gzip",
  "brotli",
  "json",
  "charset",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal"] }
aes = "0.8"
base64 = "0.22"
percent-encoding = "2"
once_cell = "1"
url = "2"
# 替身：让核心模块里的 tauri:: / tauri_plugin_opener:: 引用在无 GUI 环境下编译
tauri = { path = "../shim/tauri", package = "tauri-shim" }
tauri-plugin-opener = { path = "../shim/opener", package = "tauri-plugin-opener-shim" }

# ---- HTTP 服务 ----
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "form", "query"] }
tower-http = { version = "0.6", features = ["fs"] }
argon2 = "0.5"
getrandom = "0.2"

[profile.release]
opt-level = 3
codegen-units = 4
lto = "thin"
strip = true
