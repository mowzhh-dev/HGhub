# HGhub 网页版：https://mowzhh.top:8900 → 127.0.0.1:8901（hghub-web 只绑本机）
server {
    listen 8900 ssl http2;
    listen [::]:8900 ssl http2;
    server_name mowzhh.top;

    ssl_certificate     /etc/letsencrypt/live/mowzhh.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mowzhh.top/privkey.pem;

    # 在 TLS 端口上发了明文 HTTP → 跳到 https
    error_page 497 =301 https://$host:8900$request_uri;

    client_max_body_size 1m;
    access_log /var/log/nginx/hghub-8900.access.log;

    location / {
        proxy_pass http://127.0.0.1:8901;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
